name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee /tmp/test_out.txt

      # The job-logs API needs an authenticated token, so failures would
      # otherwise be invisible to unauthenticated inspection. Workflow
      # commands (::error::) surface as check-run annotations, which the
      # public API DOES expose — emit the ctest output there (tail +
      # head, chunked, since annotations are capped).
      - name: Expose failure output
        if: failure()
        run: |
          # Passing tests' stdout is hidden by ctest; run the diagnostic
          # binary directly so its probe output reaches the annotations.
          ./build/tests/ring_test --gtest_filter='*DIAGNOSTIC*' > /tmp/diag_out.txt 2>&1 || true
          python3 - <<'PYEOF'
          text = open('/tmp/diag_out.txt', errors='replace').read()
          text += '\n=== ctest tail ===\n'
          text += open('/tmp/test_out.txt', errors='replace').read()[-20000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for i in range(0, len(text), 3000):
              print(f"::error::CI-TEST[{i//3000}]: {text[i:i+3000]}")
          PYEOF
