name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee /tmp/test_out.txt

      # The job-logs API needs an authenticated token, so failures would
      # otherwise be invisible to unauthenticated inspection. Workflow
      # commands (::error::) surface as check-run annotations, which the
      # public API DOES expose — emit the ctest output there (tail +
      # head, chunked, since annotations are capped).
      - name: Expose failure output
        if: failure()
        run: |
          # Passing tests' stdout is hidden by ctest; run the diagnostic
          # binary directly so its probe output reaches the annotations.
          ./build/tests/ring_test --gtest_filter='*DIAGNOSTIC*' > /tmp/diag_out.txt 2>&1 || true
          python3 - <<'PYEOF'
          text = open('/tmp/diag_out.txt', errors='replace').read()
          text += '\n=== ctest tail ===\n'
          text += open('/tmp/test_out.txt', errors='replace').read()[-20000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for i in range(0, len(text), 3000):
              print(f"::error::CI-TEST[{i//3000}]: {text[i:i+3000]}")
          PYEOF

  # ASan + UBSan: the memory/UB safety net the regular builds lack.
  # -fno-sanitize-recover=all makes the first violation fail the test
  # instead of printing and continuing. TSan runs are part of the local
  # pre-push loop (see docs/design.md) — CI keeps one sanitizer job for
  # cost and runtime.
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=address,undefined -DCMAKE_CXX_FLAGS="-fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build-san -j

      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  # Short coverage-guided fuzz smokes: not a substitute for long local
  # sessions (docs/benchmarks.md), but they catch regressions in the
  # crash/hang/heap-abuse contracts the harnesses encode. libFuzzer exits
  # nonzero on a crash; 60 s per target keeps the job cheap.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang

      - name: Configure (fuzz build)
        run: cmake -S . -B build-fuzz -DBEDROCKKV_FUZZ=ON -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-fuzz -j

      - name: Fuzz RESP parser
        run: ./build-fuzz/tests/fuzz/resp_fuzz -max_total_time=60 -max_len=4096 -rss_limit_mb=2048 tests/fuzz/seeds/resp

      - name: Fuzz WAL replayer
        run: ./build-fuzz/tests/fuzz/wal_fuzz -max_total_time=60 -max_len=8192 -rss_limit_mb=2048 tests/fuzz/seeds/wal

      - name: Fuzz server stack (parser + dispatch + DB)
        run: ./build-fuzz/tests/fuzz/server_fuzz -max_total_time=60 -max_len=4096 -rss_limit_mb=2048 tests/fuzz/seeds/resp
